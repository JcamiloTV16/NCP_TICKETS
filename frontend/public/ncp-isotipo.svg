<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado Azul Eléctrico moderno -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado con bordes redondeados (Estilo App) -->
  <rect width="512" height="512" rx="115" fill="url(#brandGradient)" />

  <!-- Forma del Ticket en Blanco -->
  <path d="M130 160 h252 c22 0 40 18 40 40 v40 c-22 0 -40 18 -40 40 s18 40 40 40 v40 c0 22 -18 40 -40 40 H130 c-22 0 -40 -18 -40 -40 v-40 c22 0 40 -18 40 -40 s-18 -40 -40 -40 v-40 c0 -22 18 -40 40 -40 z" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Tres líneas estructurales (Inversiones Oeding) caladas en Azul Marino -->
  <!-- Columna Izquierda -->
  <path d="M 200 320 V 250 L 215 235 L 230 250 V 320 Z" fill="#002D72" />
  <!-- Columna Central (Más alta) -->
  <path d="M 240 320 V 220 L 256 204 L 272 220 V 320 Z" fill="#002D72" />
  <!-- Columna Derecha -->
  <path d="M 282 320 V 250 L 297 235 L 312 250 V 320 Z" fill="#002D72" />
</svg>
